<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAPD Bot</title>
<link rel="icon" href="/seal.png">
<meta property="og:title" content="LAPD Bot">
<meta property="og:description" content="Official bot of the Los Angeles Police Department - LACRP. To Protect and To Serve.">
<meta property="og:image" content="/seal.png">
<meta name="theme-color" content="#0a1640">
<style>
  :root { --navy: #0a1640; --navy-2: #13235e; --gold: #c9a227; --text: #e8ecf8; --muted: #a9b3d1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(circle at 50% 0%, var(--navy-2), var(--navy) 70%); color: var(--text);
    font-family: Georgia, "Times New Roman", serif; }
  main { width: 100%; max-width: 560px; text-align: center; }
  img { width: 180px; height: 180px; filter: drop-shadow(0 8px 24px rgba(0,0,0,.5)); }
  h1 { margin: 16px 0 4px; font-size: clamp(26px, 6vw, 36px); letter-spacing: .04em; }
  .motto { color: var(--gold); text-transform: uppercase; letter-spacing: .12em; font-size: 14px; font-weight: bold; }
  blockquote { margin: 28px 0; padding: 16px 20px; border-left: 3px solid var(--gold); background: rgba(255,255,255,.04);
    text-align: left; font-style: italic; color: var(--muted); border-radius: 0 8px 8px 0; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-family: system-ui, sans-serif; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .on .dot { background: #3ba55d; box-shadow: 0 0 8px #3ba55d; }
  .off .dot { background: #faa61a; }
  footer { margin-top: 32px; font-family: system-ui, sans-serif; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="/seal.png" alt="LAPD seal">
  <h1>Los Angeles Police Department</h1>
  <div class="motto">To Protect and To Serve</div>
  <blockquote>"{{QUOTE}}"</blockquote>
  <div class="status {{STATUS_CLASS}}"><span class="dot"></span>Bot status: {{STATUS}}</div>
  <footer>LAPD &bull; Los Angeles City Roleplay &bull; ER:LC</footer>
</main>
</body>
</html>
